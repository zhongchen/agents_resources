name: Validate entries

on:
  pull_request:
    paths:
      - 'entries/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Schema, size, and secret-pattern checks
        run: python scripts/validate_entries.py
