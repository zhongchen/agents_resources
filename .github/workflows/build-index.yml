name: Rebuild index

on:
  push:
    branches: [main]
    paths:
      - 'entries/**'

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python scripts/build_index.py

      - name: Commit index if changed
        run: |
          git config user.name "knowledge-bank-bot"
          git config user.email "actions@users.noreply.github.com"
          git add INDEX.md
          git diff --cached --quiet || git commit -m "chore: rebuild INDEX.md"
          git push
